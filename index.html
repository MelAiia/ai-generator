  <body>
    <div class="container">
      <header>
        <h1>Name AI Generator</h1>
      </header>
      <main>
        <form id="name-generator-form" action="">
          <input
            type="text"
            placeholder="Enter the topic"
            autofocus
            required
            autocomplete="off"
            id="user-input"
          />
          <input type="submit" value="Generate" />
          <br />
          <br />
        </form>
        <div class="result" id="name"></div>
